name: Start the stack
description: Build the images (from cache) and start docker compose with the test profile

inputs:
  seed-scale:
    description: Size of the seed
    default: '0.01'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - run: pnpm run build:libs
      shell: bash
    - run: |
        cp .env.example .env
        SEED_SCALE=${{ inputs.seed-scale }} ./scripts/env-test.sh .env.test
      shell: bash
    - uses: docker/setup-buildx-action@v4
    - uses: docker/bake-action@v7
      env:
        ENV_FILE: .env.test
      with:
        source: .
        files: docker-compose.yml
        load: true
        set: |
          *.cache-from=type=gha,scope=school
    - run: >-
        docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.test.yml
        up --detach --no-build --wait --wait-timeout 600
      shell: bash
      env:
        ENV_FILE: .env.test
