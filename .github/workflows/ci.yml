name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120 postgres redis mailpit
      - run: pnpm run test:integration --shard=${{ matrix.shard }}/3
      - if: failure()
        run: docker compose logs --no-color

  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120 postgres redis mailpit
      - run: pnpm run test:adversarial --shard=${{ matrix.shard }}/3
      - if: failure()
        run: docker compose logs --no-color

  worker-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120 postgres redis mailpit
      - run: pnpm run test:chaos
      - if: failure()
        run: docker compose logs --no-color

  client-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: pnpm run gen:client
      - name: Fail if the committed API description or the generated web client is stale
        run: |
          git add --intent-to-add .
          git diff --exit-code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120
      - run: ./scripts/env-test.sh
      - if: failure()
        run: docker compose logs --no-color

  ci-ok:
    if: always()
    needs:
      [typecheck, lint, unit, integration, adversarial, worker-chaos, client-drift, build, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "jobs: $RESULTS"; exit 1; }
          done
