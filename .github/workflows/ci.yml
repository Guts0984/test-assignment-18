name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120 postgres redis mailpit
      - run: pnpm run test:integration --shard=${{ matrix.shard }}/3
      - if: failure()
        run: docker compose logs --no-color

  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120 postgres redis mailpit
      - run: pnpm run test:adversarial --shard=${{ matrix.shard }}/3
      - if: failure()
        run: docker compose logs --no-color

  worker-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --wait-timeout 120 postgres redis mailpit
      - run: pnpm run test:chaos
      - if: failure()
        run: docker compose logs --no-color

  client-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: pnpm run gen:client
      - name: Fail if the committed API description or the generated web client is stale
        run: |
          git add --intent-to-add .
          git diff --exit-code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build

  # Builds every image once and fills the layer cache the stack jobs below start from.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          set: |
            *.cache-from=type=gha,scope=school
            api-1.cache-to=type=gha,mode=max,scope=school

  # A-1 exactly as the assignment says, with the full seed, and the speed budgets on it.
  compose-up:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build:libs
      - run: ./scripts/acceptance/compose-up.sh
        env:
          WAIT_TIMEOUT: '1500'
      - run: pnpm run test:perf
        env:
          ENV_FILE: .env
      - if: failure()
        run: docker compose logs --no-color --tail 200

  e2e:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [static, clock]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=${{ matrix.project }} --no-deps
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
      - if: failure()
        run: docker compose --env-file .env.test logs --no-color --tail 200

  acceptance:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [seats, money, background]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack
        with:
          seed-scale: '0.05'
      - run: pnpm exec vitest run -c vitest.stack.config.ts tests/acceptance/${{ matrix.group }}
      - if: matrix.group == 'seats'
        run: pnpm exec vitest run -c vitest.stack.config.ts tests/cross-stack
      - run: pnpm exec vitest run -c vitest.stack.config.ts tests/reconcile
      - if: failure()
        run: docker compose --env-file .env.test logs --no-color --tail 300

  ci-ok:
    if: always()
    needs:
      - typecheck
      - lint
      - unit
      - integration
      - adversarial
      - worker-chaos
      - client-drift
      - build
      - images
      - compose-up
      - e2e
      - acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "jobs: $RESULTS"; exit 1; }
          done
