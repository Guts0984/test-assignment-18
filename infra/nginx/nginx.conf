worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Docker's DNS, asked again so a restarted container is found at its new address.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api 64k;
    server api-1:3000 resolve max_fails=2 fail_timeout=2s;
    server api-2:3000 resolve max_fails=2 fail_timeout=2s;
    keepalive 64;
  }

  upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 16;
  }

  upstream paystub {
    zone paystub 64k;
    server paystub:4000 resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  server {
    listen 80;
    # Homework files are up to 10 MB; the api enforces its own, tighter limits per route.
    client_max_body_size 11m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwritten, never appended: whatever a client sends is discarded.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";

    location /api/ {
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_pass http://api;
    }

    location ~ ^/docs(-json)?(/|$) {
      proxy_pass http://api;
    }

    location /socket.io/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
      proxy_pass http://api;
    }

    location = /paystub {
      return 301 /paystub/;
    }

    location /paystub/ {
      rewrite ^/paystub/(.*)$ /$1 break;
      proxy_pass http://paystub;
    }

    location / {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://web;
    }
  }
}
